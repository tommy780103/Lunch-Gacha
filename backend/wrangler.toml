name = "lunch-gacha-search"
main = "worker.mjs"
compatibility_date = "2026-11-11"
workers_dev = true
preview_urls = false

[assets]
directory = "../public"
run_worker_first = ["/search"]

[vars]
ALLOWED_ORIGIN = "https://lunch-gacha-search.choi-tool.workers.dev"
# Enable only after setting the secret and verifying the account's free usage.
SEARCH_ENABLED = "false"

[[durable_objects.bindings]]
name = "GLOBAL_QUOTA"
class_name = "SearchQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearchQuota"]

